pipeline:
  name: NutriPlan CI/CD
  identifier: nutriplan_cicd
  projectIdentifier: nutriplan
  orgIdentifier: default
  description: |
    Full CI/CD pipeline for NutriPlan monorepo.
    CI: Lint → Type-check → Tests → Alembic dry-run (all PRs + main)
    CD: Build Docker images → Push to registry → Deploy (main only)
    Dockerfiles live in infra/dockerfiles/, compose in infra/docker-compose.yml
  tags:
    app: nutriplan
    type: cicd

  stages:
    # ──────────────────────────────────────────────────────────────────────────
    # STAGE 1: Lint & Type-check  (frontend + backend in parallel)
    # ──────────────────────────────────────────────────────────────────────────
    - stage:
        name: Lint and Type Check
        identifier: lint_typecheck
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:
              - parallel:
                  - step:
                      name: Frontend Type Check (vue-tsc)
                      identifier: frontend_typecheck
                      type: Run
                      spec:
                        connectorRef: account.docker_hub
                        image: node:22-alpine
                        shell: Sh
                        command: |
                          cd frontend
                          npm ci --prefer-offline
                          npx vue-tsc --noEmit
                          echo "✅ Frontend TypeScript: 0 errors"

                  - step:
                      name: Backend Lint (ruff)
                      identifier: backend_lint
                      type: Run
                      spec:
                        connectorRef: account.docker_hub
                        image: python:3.12-slim
                        shell: Sh
                        command: |
                          pip install ruff --quiet
                          ruff check backend/ --exclude backend/migrations/
                          echo "✅ Backend lint passed"

                  - step:
                      name: Backend Type Check (mypy)
                      identifier: backend_mypy
                      type: Run
                      spec:
                        connectorRef: account.docker_hub
                        image: python:3.12-slim
                        shell: Sh
                        command: |
                          pip install mypy pydantic beanie fastapi pymongo pydantic-settings --quiet
                          mypy backend/shared/src --ignore-missing-imports --no-error-summary || true
                          echo "✅ Backend mypy check complete"

    # ──────────────────────────────────────────────────────────────────────────
    # STAGE 2: Tests  (pytest unit + Playwright E2E in parallel)
    # ──────────────────────────────────────────────────────────────────────────
    - stage:
        name: Tests
        identifier: tests
        type: CI
        dependsOn:
          - lint_typecheck
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:
              - parallel:
                  - step:
                      name: Backend Unit + Integration Tests (pytest)
                      identifier: backend_pytest
                      type: Run
                      spec:
                        connectorRef: account.docker_hub
                        image: python:3.12-slim
                        shell: Sh
                        command: |
                          pip install \
                            fastapi uvicorn httpx pytest pytest-asyncio \
                            pydantic pydantic-settings pydantic-ai beanie \
                            pymongo motor python-jose[cryptography] passlib[bcrypt] \
                            --quiet
                          cd backend
                          pip install -e shared/ -e auth/ -e diary/ -e grocery/ \
                                      -e meal_plan/ -e subscriptions/ -e compliance/ \
                                      -e recipe/ -e marketplace/ --quiet
                          python -m pytest tests/ -v --tb=short \
                            --junitxml=test-results/pytest.xml
                          echo "✅ All pytest tests passed"
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: Abort

                  - step:
                      name: Frontend Playwright E2E (Chromium)
                      identifier: frontend_e2e
                      type: Run
                      spec:
                        connectorRef: account.docker_hub
                        image: mcr.microsoft.com/playwright:v1.47.0-jammy
                        shell: Sh
                        command: |
                          cd frontend
                          npm ci --prefer-offline
                          npx playwright install chromium --with-deps
                          # Start Vite dev server in background
                          npm run dev &
                          DEV_PID=$!
                          # Wait for server
                          npx wait-on http://localhost:5173 --timeout 60000
                          # Run E2E suite
                          npm run test:e2e -- --project=chromium \
                            --reporter=junit \
                            --output=../test-results/playwright/
                          kill $DEV_PID || true
                          echo "✅ E2E tests passed"

              - step:
                  name: Alembic Migration Dry-run (offline SQL)
                  identifier: alembic_dryrun
                  type: Run
                  spec:
                    connectorRef: account.docker_hub
                    image: python:3.12-slim
                    shell: Sh
                    command: |
                      pip install alembic sqlalchemy psycopg2-binary --quiet
                      cd backend
                      pip install -e shared/ -e auth/ -e diary/ -e grocery/ \
                                  -e meal_plan/ -e subscriptions/ --quiet
                      cd migrations
                      alembic --config alembic.ini upgrade head --sql > /dev/null
                      echo "✅ Migration SQL generated without errors"

          reports:
            type: JUnit
            spec:
              paths:
                - "test-results/**/*.xml"

    # ──────────────────────────────────────────────────────────────────────────
    # STAGE 3: Build Artifacts
    # ──────────────────────────────────────────────────────────────────────────
    - stage:
        name: Build
        identifier: build
        type: CI
        dependsOn:
          - tests
        when:
          pipelineStatus: Success
          condition: <+trigger.branch> == "main"
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:
              - step:
                  name: Build Frontend Bundle & Visualizer Stats
                  identifier: build_frontend
                  type: Run
                  spec:
                    connectorRef: account.docker_hub
                    image: node:22-alpine
                    shell: Sh
                    command: |
                      cd frontend
                      npm ci --prefer-offline
                      npm run build:analyze
                      echo "✅ Frontend bundle built → dist/ (including dist/stats.html)"

              - step:
                  name: Lighthouse CI Performance & Accessibility Audit
                  identifier: lighthouse_audit
                  type: Run
                  spec:
                    connectorRef: account.docker_hub
                    image: node:22-alpine
                    shell: Sh
                    command: |
                      cd frontend
                      npm ci --prefer-offline
                      npx @lhci/cli autorun || true
                      echo "✅ Lighthouse CI checks completed"

              # Build & push backend image (build context = repo root so all services accessible)
              - step:
                  name: Build & Push Backend Docker Image
                  identifier: build_docker_backend
                  type: BuildAndPushDockerRegistry
                  spec:
                    connectorRef: account.docker_hub
                    repo: nutriplan/backend
                    tags:
                      - <+pipeline.sequenceId>
                      - <+trigger.commitSha>.slice(0,7)
                      - latest
                    context: .
                    dockerfile: infra/dockerfiles/backend.Dockerfile

              # Build & push frontend Nginx image
              - step:
                  name: Build & Push Frontend Docker Image
                  identifier: build_docker_frontend
                  type: BuildAndPushDockerRegistry
                  spec:
                    connectorRef: account.docker_hub
                    repo: nutriplan/frontend
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    context: .
                    dockerfile: infra/dockerfiles/frontend.Dockerfile

    # ──────────────────────────────────────────────────────────────────────────
    # STAGE 4: Deploy  (main branch only — rolling update via Docker Compose)
    # ──────────────────────────────────────────────────────────────────────────
    - stage:
        name: Deploy
        identifier: deploy
        type: CI
        dependsOn:
          - build
        when:
          pipelineStatus: Success
          condition: <+trigger.branch> == "main"
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:
              - step:
                  name: Deploy via Docker Compose (rolling)
                  identifier: deploy_compose
                  type: Run
                  spec:
                    connectorRef: account.docker_hub
                    image: docker/compose:latest
                    shell: Sh
                    envVariables:
                      DOCKER_IMAGE_TAG: <+pipeline.sequenceId>
                      PG_BASE_URL: <+pipeline.variables.PG_BASE_URL>
                      MONGODB_URL: <+pipeline.variables.MONGODB_URL>
                      REDIS_URL: <+pipeline.variables.REDIS_URL>
                    command: |
                      echo "📦 Pulling latest images (tag: $DOCKER_IMAGE_TAG)..."
                      docker compose -f infra/docker-compose.yml pull

                      echo "🔄 Rolling update — zero-downtime restart..."
                      docker compose -f infra/docker-compose.yml up -d \
                        --remove-orphans \
                        --no-build

                      echo "⏳ Waiting for services to be healthy..."
                      sleep 15

                      echo "🔍 Health check..."
                      curl -sf http://localhost:8001/health | grep -q '"status":"ok"' && \
                        echo "✅ auth-service healthy"
                      curl -sf http://localhost:8009/health | grep -q '"status":"ok"' && \
                        echo "✅ meal-plan-service healthy"

                      docker compose -f infra/docker-compose.yml ps
                      echo "✅ Deployment complete — build #$DOCKER_IMAGE_TAG live"

  properties:
    ci:
      codebase:
        connectorRef: account.github
        repoName: GA352491/project-nutri
        build:
          type: branch
          spec:
            branch: <+input>

  variables:
    - name: PG_BASE_URL
      type: Secret
      value: <+secrets.getValue("nutriplan_pg_base_url")>
    - name: MONGODB_URL
      type: Secret
      value: <+secrets.getValue("nutriplan_mongo_url")>
    - name: REDIS_URL
      type: Secret
      value: <+secrets.getValue("nutriplan_redis_url")>
    - name: JWT_SECRET
      type: Secret
      value: <+secrets.getValue("nutriplan_jwt_secret")>
    - name: STRIPE_SECRET_KEY
      type: Secret
      value: <+secrets.getValue("nutriplan_stripe_secret")>
