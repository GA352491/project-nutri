name: nutriplan
description: "NutriPlan — AI-Driven Nutrition Platform"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3+1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.68.0

  # SVG support
  flutter_svg: ^2.0.10+1

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1

  # Shared preferences
  shared_preferences: ^2.2.3
  web_socket_channel: ^3.0.3

  # Health & Biometric Wearables (Apple HealthKit & Android Health Connect)
  health: ^13.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
