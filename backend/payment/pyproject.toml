[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-service"
version = "0.1.0"
description = "NutriPlan Payment Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "stripe>=10.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "nutriplan-shared @ file:///${PROJECT_ROOT}/../shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]
