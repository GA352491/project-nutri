[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admin-service"
version = "0.1.0"
description = "NutriPlan Admin and CMS Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "nutriplan-shared @ file:///${PROJECT_ROOT}/../shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src/admin_service"]
