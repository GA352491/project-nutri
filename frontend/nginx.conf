server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend services
    location /api/v1/auth {
        proxy_pass http://auth-service:8001;
    }
    location /api/v1/compliance {
        proxy_pass http://compliance-service:8002;
    }
    location /api/v1/user {
        proxy_pass http://profile-service:8003;
    }
    location /api/v1/profile {
        proxy_pass http://profile-service:8003;
    }
    location /api/v1/recipes {
        proxy_pass http://recipe-service:8004;
    }
    location /api/v1/diary {
        proxy_pass http://diary-service:8005;
    }
    location /api/v1/grocery {
        proxy_pass http://grocery-service:8006;
    }
    location /api/v1/subscriptions {
        proxy_pass http://subscription-service:8007;
    }
    location /api/v1/plan {
        proxy_pass http://meal-plan-service:8009;
    }
    location /api/v1/notifications {
        proxy_pass http://notifications-service:8010;
    }
    location /api/v1/admin {
        proxy_pass http://admin-service:8020;
    }
    location /api/v1/marketplace {
        proxy_pass http://marketplace-service:8021;
    }
}
